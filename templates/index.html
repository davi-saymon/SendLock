<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SendLock - Compartilhamento Temporário</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css')}}">
</head>
<body class="tema-escuro-inicio">
    <div class="container-inicio">
        <main class="inicio">
            <h1>🔒 SendLock</h1>
            <p>Plataforma de Compartilhamento Temporário de Arquivos</p>
            <form action="/criar-sala" method="POST">
                <button class="botao-inicio">
                    Criar Sala Temporária
                </button>
            </form>
        </main>
    </div>

    <!-- Salas Recentes -->
    <div id="secao-recentes" class="container-recentes">
        <p>Salas Recentes (últimas 5)</p>
        <div id="lista-salas-recentes" class="div-recentes"></div>
    </div>


    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="mensagens-flash">
                {% for category, message in messages %}
                    <div class="alerta alerta-{{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}


    <script>
        // 1. Verifica se o Flask enviou um pedido para remover uma sala expirada
        const urlParams = new URLSearchParams(window.location.search);
        const idParaRemover = urlParams.get('remover_id');

        if (idParaRemover) {
            let recentes = JSON.parse(localStorage.getItem('sendlock-recentes') || '[]');
            recentes = recentes.filter(id => id !== idParaRemover);
            localStorage.setItem('sendlock-recentes', JSON.stringify(recentes));

            // Lipa o parâmetro da URL sem recarregar a págian do zero
            window.history.replaceState({}, document.title, window.location.pathname);
        }


        // 2. Remover uma sala específica do hitórico
        function removerSalaRecente(event, idParaRemover) {
            event.preventDefault();
            event.stopPropagation();

            // Envia um pedido para o Flask apagar a pasta física no servidor
            fetch(`/sala/${idParaRemover}/excluir-pasta`, {
                method: 'POST'
            }).then(() =>{
                let recentes = JSON.parse(localStorage.getItem('sendlock-recentes') || '[]');

                // Filtra removendo o ID selecionado
                recentes = recentes.filter(id => id !== idParaRemover);

                // Atualiza o localStoreage
                localStorage.setItem('sendlock-recentes', JSON.stringify(recentes));

                // Recarrega a página para atualizar a lista visualmente
                window.location.reload();
            
            }).catch(err => {
                console.error('Erro ao apagar a pasta da sala:', err);
            });

        }

        
        // 3. Renderiza as salas recentes
        const recentes = JSON.parse(localStorage.getItem('sendlock-recentes') || '[]');

        if (recentes.length > 0) {
            const secao = document.getElementById('secao-recentes');
            const lista = document.getElementById('lista-salas-recentes');

            secao.style.display = 'flex';
            lista.innerHTML = '';

            recentes.forEach(id => {
                // Criar um container para alinhar o botão com o 'x'
                const wrapper = document.createElement('div');
                wrapper.className = 'sala-recente-wrapper';

                const link = document.createElement('a');
                link.href = `/sala/${id}`;
                link.textContent = `Sala: ${id}`;
                link.className = 'bt-sala-recente';
                
                const btExcluir = document.createElement('button');
                btExcluir.innerHTML = '&times;'; // Símbolo de 'X'
                btExcluir.className = 'bt-excluir-sala';
                btExcluir.title = 'Apagar sala';

                // Associa o evento de clique ao botão de exclusão
                btExcluir.onclick = (e) => removerSalaRecente(e, id);

                wrapper.appendChild(link);
                wrapper.appendChild(btExcluir);
                lista.appendChild(wrapper);
            });
        }
    
        // Animação de entrada e saída
        document.addEventListener('DOMContentLoaded', () => {
            const mensagens = document.querySelectorAll('.alerta');

            mensagens.forEach(msg => {
                setTimeout(() => {
                    msg.classList.add('visivel');
                }, 50);
            
                // 4. Faz a mensagem flash desaparecer após 4 segundos
                setTimeout(() => {
                    msg.style.transition = 'opacity 0.7s ease';
                    msg.style.opacity = '0';
                    setTimeout(() => msg.remove(), 800);
                }, 3000);
            });
        });
    </script>
</body>
</html>
